<!DOCTYPE html>
<html lang="en">

<head>
    <title>Registration Form</title>
</head>

<body>
    <form>
        <table align="center" cellspacing="5px" cellpadding="10px" bgcolor="green">
            <th align="left" style="background-color: orange;" colspan="2">Sign Up</th>
            <tr>
                <td>
                    <label for="id1">First Name</label>
                </td>
                <td>
                    <input type="text" placeholder="Enter First Name" id="id1" name="Firstname" required>
                </td>
            <tr>
                <td>
                    <label for="id2">Last Name</label>
                </td>
                <td>
                    <input type="text" placeholder="Enter Last Name" id="id2" name="Lastname">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Screen Name</label>
                </td>
                <td>
                    <input type="text" placeholder="Enter Screen Name">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Date Of Birth</label>
                </td>
                <td>
                    <select>
                        <option value="Jan">Jan</option>
                        <option value="Feb">Jeb</option>
                        <option value="Mar">Mar</option>
                        <option value="Apr">Apr</option>
                        <option value="May">May</option>
                        <option value="Jun">Jun</option>
                        <option value="Jul">Jul</option>
                        <option value="Sep">Sep</option>
                        <option value="Oct">Oct</option>
                        <option value="Nov">Nov</option>
                        <option value="Dec">Dec</option>
                    </select>
                    <select>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                        <option value="17">17</option>
                        <option value="18">18</option>
                        <option value="19">19</option>
                        <option value="20">20</option>
                        <option value="21">21</option>
                        <option value="22">22</option>
                        <option value="23">23</option>
                        <option value="24">24</option>
                        <option value="25">25</option>
                        <option value="26">26</option>
                        <option value="27">27</option>
                        <option value="28">28</option>
                        <option value="29">29</option>
                        <option value="30">30</option>
                    </select>
                    <select>
                        <option value="Year">1990</option>
                        <option value="Year">1991</option>
                        <option value="Year">1992</option>
                        <option value="Year">1993</option>
                        <option value="Year">1994</option>
                        <option value="Year">1995</option>
                        <option value="Year">1996</option>
                        <option value="Year">1997</option>
                        <option value="Year">1998</option>
                        <option value="Year">1999</option>
                        <option value="Year">2000</option>
                        <option value="Year">2001</option>
                        <option value="Year">2002</option>
                        <option value="Year">2003</option>
                        <option value="Year">2004</option>
                        <option value="Year">2005</option>
                    </select>
                </td>
            <tr>
                <td>
                    <label>Gender</label>
                </td>
                <td>
                    <input type="radio" id="Id1" name="name">
                    <label>Male</label>
                    <input type="radio" id="id2" name="name">
                    <label>Female</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label>Country</label>
                </td>
                <td colspan="2">
                    <select>
                        <option value="IND">IND</option>
                        <option value="USA">USA</option>
                        <option value="DUB">DUBAI</option>
                        <option value="UK">UK</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label>E-mail</label>
                </td>
                <td>
                    <input type="email" placeholder="Enter E-mail">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Phone</label>
                </td>
                <td>
                    <input type="tel" placeholder="Enter Phone Number">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="id3">Password</label>
                </td>
                <td>
                    <input type="password" placeholder="Enter Password" id="id3" name="password">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Confirm Password</label>
                </td>
                <td>
                    <input type="password" placeholder="Confirm Password">
                </td>
            </tr>
            <tr>
                <td>

                </td>
                <td>
                    <input type="checkbox">
                    <label>I agree to the Terms of Use</label>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="right" style="background-color: orange;"><input type="submit" value="submit" style="background-color: green;">
                <input type="submit" value="cancel" style="background-color: red;"></td>
            </tr>
        </table>
    </form>

</body>

</html>
