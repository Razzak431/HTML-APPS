<!DOCTYPE html>
<html lang="en">

<head>
    <title>Registration Form</title>
</head>

<body>
    <form>
        <caption><center><h3><u>Registration Form</u></h3></center></caption>
        <table bgcolor="silver" align="center" cellsapcing="10px" cellpadding="12px"> 
            <tr>
                <td>
                    <label for="Firstname">First Name</label>
                </td>
                <td>
                    <input type="text" id="Firstname" name="Firstname">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Lastname">Last Name</label>
                </td>
                <td>
                    <input type="text" id="Lastname" name="Lastname">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Nickname">Nick Name</label>
                </td>
                <td>
                    <input type="text" id="Nickname" name="Nickname">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Email">E-mail</label>
                </td>
                <td>
                    <input type="email" id="Eamil" name="Email">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Password">Password</label>
                </td>
                <td>
                    <input type="password" id="Password" name="Password">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Dateofbirth">Dtae Of Birth</label>
                </td>
                <td>
                    <input type="date" id="Dateofbirth" name="Dateofbirth">
                </td>
            </tr>
             <tr>
                <td>
                    <label>Gender</label>
                </td>
                <td>
                    <input type="radio" id="Male" name="Gender">
                    <label>Male</label>
                    <input type="radio" id="Female" name="Gender">
                    <label>Female</label>
                    <input type="radio" id="Others" name="Gender">
                    <label>Others</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="MobileNo">Mobile Number</label>
                </td>
                <td>
                    <input type="tel" id="MobileNo" name="MobileNo">
                </td>
            </tr>
            <tr>
                <td>
                <label>Address</label>
                </td>
                <td>
                    <textarea name="Area" id="Area" rows="4" cols="20"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    
                </td>
                <td>
                    <input type="submit" id="submit" name="Submit">
                    <input type="reset" id="reset" name="Reset">
                </td>
            </tr>
        </table>
    </form>

</body>

</html>
