<!DOCTYPE html>
<html lang="en">

<head>
    <title>HTML FORM</title>
</head>

<body>
    <form>
        <table align="center" bgcolor="silver" cellspacing="4px" cellpadding="4px">
            <caption>
                    <h1>HTML FORM</h1>
            </caption>
            <tr>
                <td>
                    <label for="Text">First Name :</label>
                </td>
                <td>
                    <input type="text" id="Text" name="Firstname">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="id2">Last Name :</label>
                </td>
                <td>
                    <input type="text" id="id2" name="name2">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="id3">Date Of Birth :</label>
                </td>
                <td>
                    <input type="date" id="id3" name="name3">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="id4">Email ID:</label>
                </td>
                <td>
                    <input type="email" id="id4" name="name4">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="id5">Mobile Number :</label>
                </td>
                <td>
                    <input type="tel" id="id5" name="name5">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" id="id6" name="name6">
                    <input type="reset" id="id7" name="name7">
                </td>
                
            </tr>
        </table>
    </form>

</body>

</html>
