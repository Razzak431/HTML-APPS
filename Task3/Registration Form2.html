<!DOCTYPE html>
<html lang="en">
<head>
    <title>Registration Form</title>
</head>
<body>
    <form>
        <table align="center" bgcolor="silver">
            <caption><center><h3>Registration Form</h3></center></caption>
            <tr>
                <td>
                    <label for="Fname">First Name</label><font color="tomato">*</font>
                    <br>
                    <input type="text" id="Fname" name="Fname" required>
                </td>
                <td>
                    <label for="Lname">Last Name</label>
                    <br>
                    <input type="text" id="Lname" name="Lname">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Date">Birthday</label>
                    <br>
                    <input type="date" id="Date" name="Date">
                </td>
                <td>
                    <label>Gender</label>
                    <br>
                    <input type="radio" value="Male" name="Gender">
                    <label>Male</label>
                    <input type="radio" value="Female" name="Gender">
                    <label>Female</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label>Email</label>
                    <br>
                    <input type="email" id="Email" name="Email">
                </td>
                <td>
                    <label>Phone Number</label>
                    <br>
                    <input type="tel" id="PhoneNo" name="PhoneNo">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Subject</label>
                    <br>
                    <select>
                        <option value="Subject">Choose Option</option>
                        <option value="HTML">HTML</option>
                        <option value="CSS">CSS</option>
                        <option value="Javascript">Javascript</option>
                        <option value="Bootstrap">Bootstarp</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" id="submit" name="submit">
                </td>
            </tr>
        </table>
    </form>
    
</body>
</html>
