<!DOCTYPE html>

<head>
    <title>SignUp Page</title>
</head>

<body>
    <header>
        <center>
            <h1>FandF</h1>
        </center>
        <p align="center">
            <a href="Home.html">Home</a> &nbsp; | &nbsp;
            <a href="About.html">About</a> &nbsp; | &nbsp;

            <a href="#">SignUp</a> &nbsp; | &nbsp;
            <a href="Signin.html">Signin</a>
        </p>
        <hr>
    </header>
    <table align="center" border="1px" cellspacing="4px" cellpadding="3px">
        <form>
             <h3 align="center">SignUp Form</h3>
            <tr>
                <label>
                    <td>UserID:</td>
                </label>
                <td>
                    <input type="text" id="Text" name="UserId">
                </td>
            </tr>
            <tr>
                 <label>
                    <td>Password:</td>
                 </label>
                <td>
                    <input type="password" id="Password" name="Password">
                </td>
            </tr>
            <tr>
                <label>
                    <td>
                    Address:
                </td>
                </label>
                <td>
                    <textarea name="textarea" id="textarea"></textarea>
                </td>
            </tr>
            <tr>
                <label>
                    <td>
                    Phone:
                </td>
                </label>
                <td>
                    <input type="tel" id="Mobile" name="Phone"> 
                </td>
            </tr>
            <tr>
                <label>
                    <td>
                    Date Of Order:
                </td>
                </label>
                <td>
                    <input type="date" id="Date" name="Date Of Birth">
                </td>
            </tr>
            <tr>
                <td align="center" colspan="2" id="Signup" name="Signup">
                    <input type="submit" value="SignUp">
                </td>
            </tr>
        </form>
    </table>
    <br><br><br><br><br><br><br><br>
